<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YK中午吃什麼-點餐系統</title>
  <!-- 第 37 步：檔名後面的 ?v=51 是版本號（第 40 步換成 40，第 42 步換成 41，第 46 步換成 42，第 46 步修正換成 43，第 47 步換成 44，第 47 步第二階段換成 45，第 49 步換成 46，第 49 步修正 1 換成 47，第 49 步修正 2 換成 48，第 49 步修正 3 換成 49，第 49 步修正 4 換成 50，第 50 步換成 51，第 53 步紅隊換成 52）。之後改了 app.js 或 style.css，這裡三個號碼都要換新（例如 ?v=53），LINE 才會重新下載 -->
  <link rel="stylesheet" href="style.css?v=52">
  <!-- 第 16 步：先和 Apps Script、LINE 的伺服器建立連線，第一次呼叫會快一點 -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://api.line.me">
  <link rel="preconnect" href="https://static.line-scdn.net"><!-- 第 47 步 -->
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="返回">‹</button>
    <h1 id="title">YK中午吃什麼-點餐系統</h1>
    <button id="historyBtn" class="link-btn" hidden>我的訂單</button>
  </header>

  <main id="view" aria-live="polite">
    <div class="center muted">載入中…</div>
  </main>

  <div id="bottom" class="bottom-bar" hidden></div>

  <!-- 品項選項視窗 -->
  <div id="sheet" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div id="sheetBody"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js?v=52"></script>
  <!-- 第 47 步：LINE 登入元件改成 async（不擋畫面），app.js 會等它載好；id 不要改，app.js 靠它找 -->
  <script id="liffSdk" async src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="app.js?v=52"></script>
</body>
</html>
